version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Types must match the oldest supported Node version, not the newest.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # eslint and @eslint/js must move together (peer dependency).
      eslint:
        patterns: ['eslint', '@eslint/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
